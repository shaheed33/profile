<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Road to 10,000</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{
  --paper:#f7f8fa; --sheet:#ffffff; --ink:#151a26; --ink-2:#4a5063; --ink-3:#7b8092;
  --rule:#dfe2ea; --grid:#eceef3; --accent:#8a4f12; --accent-soft:#f6ecdf; --peer:#b3b5ba;
  --good:#1f7a4d; --warn:#9a6200; --crit:#b3261e; --good-bg:#e5f3ec; --warn-bg:#fbf0dc; --crit-bg:#f9e4e2;
  --display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10131b; --sheet:#181c27; --ink:#eaecf2; --ink-2:#b5b9c8; --ink-3:#878b9c;
  --rule:#2a2f3d; --grid:#232836; --accent:#e2a35a; --accent-soft:#3a2a17; --peer:#5a5c63;
  --good:#5cc495; --warn:#e2a84a; --crit:#f08a82; --good-bg:#16302a; --warn-bg:#352a16; --crit-bg:#3a1c1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10131b; --sheet:#181c27; --ink:#eaecf2; --ink-2:#b5b9c8; --ink-3:#878b9c;
  --rule:#2a2f3d; --grid:#232836; --accent:#e2a35a; --accent-soft:#3a2a17; --peer:#5a5c63;
  --good:#5cc495; --warn:#e2a84a; --crit:#f08a82; --good-bg:#16302a; --warn-bg:#352a16; --crit-bg:#3a1c1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 64px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2.2rem,5vw,3.4rem);letter-spacing:-.01em}
h2{font-size:clamp(1.55rem,3vw,2.1rem)}
h3{font-size:1.08rem;font-family:var(--body);font-weight:600}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lede{font-size:1.12rem;color:var(--ink-2);max-width:64ch}
.num{font-variant-numeric:tabular-nums}
header.top{display:grid;gap:18px;padding-bottom:28px;border-bottom:1px solid var(--rule)}
.markline{display:flex;align-items:center;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.85rem;color:var(--ink-3)}
.findings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-block:28px 8px;border-top:3px solid var(--ink)}
.finding{padding:18px 18px 18px 0;display:grid;gap:8px;align-content:start}
.finding+.finding{padding-left:18px;border-left:1px solid var(--rule)}
.finding .big{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--ink)}
.finding .big em{font-style:normal;color:var(--accent)}
.finding .big small{font-size:1.1rem;color:var(--ink-3)}
.finding p{font-size:.92rem;color:var(--ink-2)}
.finding .tag{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
section.block{padding-top:56px;display:grid;gap:22px}
.sechead{display:grid;gap:10px;max-width:72ch}
.sechead .eyebrow b{color:var(--accent);font-weight:500}
.read{max-width:70ch;color:var(--ink-2)}
.read+.read{margin-top:-8px}
.read strong{color:var(--ink);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px;display:grid;gap:12px;min-width:0;align-content:start}
.panel.wide{grid-column:1/-1}
.src{font-size:.75rem;color:var(--ink-3)}
.chart{width:100%;min-width:0;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--mono);font-size:11px}
.chart text.lab{fill:var(--ink-2);font-family:var(--body);font-size:12px}
.chart text.me{fill:var(--ink);font-family:var(--body);font-size:12px;font-weight:600}
.chart text.val{fill:var(--ink-2)}
.chart text.valme{fill:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;font-size:.92rem;color:var(--ink);border-radius:0 4px 4px 0;max-width:82ch}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--accent-soft);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.78rem;line-height:1.35;padding:6px 9px;border-radius:4px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s;z-index:5}
.tip.on{opacity:1}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:start}
.ctrl{display:grid;gap:18px}
.ctrl label{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;font-weight:600}
.ctrl label output{font-family:var(--mono);font-weight:500;color:var(--accent)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .hint{font-size:.78rem;color:var(--ink-3);margin-top:-12px}
.out{display:grid;gap:14px}
.out .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.out .row span{color:var(--ink-2);font-size:.92rem}
.out .row b{font-family:var(--display);font-size:1.7rem;font-weight:500;font-variant-numeric:tabular-nums}
.out .verdict{font-size:.95rem;color:var(--ink)}
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.rec{display:grid;gap:8px;padding-top:14px;border-top:2px solid var(--ink);align-content:start}
.rec h3{font-family:var(--display);font-weight:500;font-size:1.25rem}
.rec p{color:var(--ink-2);font-size:.94rem}
.rec .basis{font-size:.8rem;color:var(--ink-3)}
.timeline{display:grid;gap:0;position:relative}
.tl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--rule)}
.tl b{font-family:var(--mono);font-size:.82rem;font-weight:500;color:var(--accent)}
.tl span{color:var(--ink-2);font-size:.93rem}
.tl.down b{color:var(--crit)}
footer{margin-top:64px;padding-top:22px;border-top:1px solid var(--rule);display:grid;gap:14px;font-size:.84rem;color:var(--ink-2)}
footer ol{margin:0;padding-left:20px;display:grid;gap:4px}
.toggle{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));font:inherit;font-size:.78rem;background:var(--sheet);border:1px solid var(--rule);color:var(--ink-2);padding:5px 11px;border-radius:999px;cursor:pointer;box-shadow:0 1px 3px rgba(20,26,38,.12)}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.gate{min-height:70vh;display:grid;place-items:center}
.gate form{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:28px;display:grid;gap:14px}
.gate h1{font-size:1.9rem}
.gate p{color:var(--ink-2);font-size:.95rem;line-height:1.5}
.gate label{font-size:.85rem;font-weight:600}
.gate input{font-family:var(--mono);font-size:1.6rem;letter-spacing:.5em;text-align:center;padding:10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);width:100%}
.gate button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:4px;background:var(--accent);color:var(--sheet);cursor:pointer}
.gate button[disabled]{opacity:.6;cursor:progress}
.gate .err{color:var(--crit);font-size:.88rem}
@media (max-width:860px){
  .findings{grid-template-columns:repeat(2,minmax(0,1fr))}
  .finding:nth-child(3){padding-left:0;border-left:0}
  .finding:nth-child(n+3){border-top:1px solid var(--rule)}
  .cols,.recs,.calc{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){
  .findings{grid-template-columns:minmax(0,1fr)}
  .finding,.finding+.finding{padding-left:0;border-left:0}
  .finding+.finding{border-top:1px solid var(--rule)}
  .panel{padding:14px}
  .tl{grid-template-columns:84px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<div class="wrap gate">
  <form id="gate-form" autocomplete="off">
    <span class="eyebrow">Independent analysis &middot; Glen Innes Severn, New England</span>
    <h1>Road to 10,000</h1>
    <p>This page is shared privately. Enter the 4-digit access code provided in my cover letter.</p>
    <label for="gate-code">Access code</label>
    <input id="gate-code" name="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autofocus>
    <p class="err" id="gate-err" role="alert" hidden>That code is not right. Check the cover letter and try again.</p>
    <button type="submit" id="gate-btn">View the briefing</button>
  </form>
</div>
</div>

const KEY='brief-glen-innes-severn';
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function show(c){document.getElementById('app').innerHTML=c.html;window.__BW_DATA=c.data;const s=document.createElement('script');s.textContent=c.js;document.body.appendChild(s)}
const form=document.getElementById('gate-form'),inp=document.getElementById('gate-code'),err=document.getElementById('gate-err'),btn=document.getElementById('gate-btn');
async function attempt(code,remember){
  btn.disabled=true;btn.textContent='Opening';err.hidden=true;
  try{const c=await open(code);if(remember)try{localStorage.setItem(KEY,JSON.stringify({code,t:Date.now()}))}catch(e){}show(c);return true}
  catch(e){btn.disabled=false;btn.textContent='View the briefing';return false}
}
form.addEventListener('submit',async ev=>{ev.preventDefault();const ok=await attempt(inp.value.trim(),true);if(!ok){err.hidden=false;inp.select()}});
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Date.now()-saved.t<30*864e5)attempt(saved.code,false).then(ok=>{if(!ok)localStorage.removeItem(KEY)})}catch(e){}
})();
