name: Update NSW Roadmap tracker

on:
  schedule:
    - cron: "0 21 * * 1"   # every Monday, 8am Sydney time
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - name: Check AEMO for a new release
        id: check
        run: |
          python scripts/download_aemo.py --latest | tee check.txt
          if grep -q "^NEW" check.txt; then echo "new=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild the data
        if: steps.check.outputs.new == 'yes'
        run: python scripts/build_roadmap.py
      - name: Save the changes
        if: steps.check.outputs.new == 'yes'
        run: |
          git config user.name "roadmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw data/roadmap.js
          git commit -m "Roadmap tracker: new AEMO release"
          git push
