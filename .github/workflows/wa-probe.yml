name: Probe (temporary)
on:
  push:
    branches: [claude/zealous-archimedes-8qq9t4]
    paths: [".github/probe/**", ".github/workflows/wa-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python -u .github/probe/probe.py
      - run: |
          git config user.name probe; git config user.email actions@users.noreply.github.com
          git add raw/councils && git commit -qm "Probe: council performance spreadsheets" && git push origin HEAD
