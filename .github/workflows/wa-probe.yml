name: Probe (temporary)
on:
  push:
    branches: [claude/zealous-archimedes-8qq9t4]
    paths: [".github/workflows/wa-probe.yml", "scripts/build_vic_housing.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy requests
      - run: python -u scripts/build_vic_housing.py 2>&1 | tee raw/vic/build.log
        continue-on-error: true
      - run: |
          for f in raw/vic/*.csv; do gzip -nkf "$f"; done
          ls -la raw/vic
          git config user.name probe; git config user.email actions@users.noreply.github.com
          git add raw/vic/*.gz raw/vic/build.log; [ -e data/vic_housing.js ] && git add data/vic_housing.js
          git commit -qm "Probe: raw Victorian housing downloads" && git push origin HEAD
