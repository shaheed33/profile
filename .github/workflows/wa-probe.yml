name: Probe (temporary)
on:
  push:
    branches: [claude/zealous-archimedes-8qq9t4]
    paths: [".github/workflows/wa-probe.yml", "scripts/fetch_vic_static.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python -u scripts/fetch_vic_static.py
      - run: |
          git config user.name probe; git config user.email actions@users.noreply.github.com
          git add data/vic_targets.csv data/vic_lga.js
          git commit -qm "Victorian council targets and boundaries" && git push origin HEAD
