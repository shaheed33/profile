name: Download data for council briefings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_briefs.py"
      - ".github/workflows/briefs-data.yml"

permissions:
  contents: write

concurrency:
  group: briefs-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests openpyxl
      - run: python -u scripts/fetch_briefs.py
      - name: Save the data
        run: |
          git config user.name "briefs-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw/briefs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Council briefings: download source data $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
