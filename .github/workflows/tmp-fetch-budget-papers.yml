name: tmp-fetch-budget-papers
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch ACT papers through a real browser
        run: |
          mkdir -p tmp_papers && pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          cat > fetch.py <<'PY'
          import asyncio, hashlib, pathlib
          from playwright.async_api import async_playwright
          URLS = {
            "act_tables.xlsx": "https://www.treasury.act.gov.au/__data/assets/excel_doc/0009/3081492/ACT-Government-2026-27-Budget-tables.xlsx",
            "act_outlook.pdf": "https://www.treasury.act.gov.au/__data/assets/pdf_file/0003/3080667/2026-27-Budget-Outlook.pdf",
          }
          async def main():
              out = pathlib.Path("tmp_papers"); out.mkdir(exist_ok=True)
              async with async_playwright() as p:
                  b = await p.chromium.launch(headless=False)
                  ctx = await b.new_context(accept_downloads=True)
                  page = await ctx.new_page()
                  await page.goto("https://www.treasury.act.gov.au/budget/budget-2026-27/budget-papers-and-statements", wait_until="networkidle")
                  await page.wait_for_timeout(8000)
                  print("title:", await page.title())
                  for name, url in URLS.items():
                      try:
                          async with page.expect_download(timeout=120000) as dl:
                              await page.evaluate("u => { const a=document.createElement('a'); a.href=u; a.download=''; document.body.appendChild(a); a.click(); }", url)
                          d = await dl.value
                          path = out/name
                          await d.save_as(str(path))
                          body = path.read_bytes()
                          print(name, len(body), body[:5])
                          if body[:4] in (b"%PDF", b"PK\x03\x04"):
                              with open(out/"manifest3.txt","a") as f: f.write(f"{name} {len(body)} {hashlib.sha256(body).hexdigest()} {url}\n")
                          else:
                              path.unlink()
                      except Exception as e:
                          print(name, "ERR", repr(e)[:300])
                  await b.close()
          asyncio.run(main())
          PY
          xvfb-run -a python fetch.py 2>&1 | tee tmp_papers/act_log.txt; true
          ls -la tmp_papers
      - name: Commit
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A tmp_papers && (git commit -m "Temporary: ACT papers [skip ci]" && git push) || echo nothing
