name: tmp-fetch-budget-papers
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ACT and NT papers
        run: |
          mkdir -p tmp_papers && cd tmp_papers
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          ok() { head -c 5 "$1" | grep -qE '%PDF|PK' ; }
          get() {
            out=$1; url=$2
            curl -sSL -A "$UA" -H "Accept: */*" -H "Accept-Language: en-AU,en;q=0.9" --retry 2 -m 180 -o "$out" "$url" || true
            if ! ok "$out"; then
              curl -sSL -A "$UA" --retry 2 -m 240 -o "$out" "https://web.archive.org/web/2026id_/$url" || true
            fi
            if ok "$out"; then echo "$out $(stat -c%s "$out") $(sha256sum "$out"|cut -c1-64) $url" >> manifest2.txt; else echo "FAIL $out $url" >> manifest2.txt; rm -f "$out"; fi
          }
          get act_tables.xlsx "https://www.treasury.act.gov.au/__data/assets/excel_doc/0009/3081492/ACT-Government-2026-27-Budget-tables.xlsx"
          get act_outlook.pdf "https://www.treasury.act.gov.au/__data/assets/pdf_file/0003/3080667/2026-27-Budget-Outlook.pdf"
          get nt_bp2.pdf "https://budget.nt.gov.au/__data/assets/pdf_file/0004/1609744/2026-27-budget-bp2.pdf"
          rm -f act_outlook.docx
          cat manifest2.txt
      - name: Commit
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A tmp_papers && git commit -m "Temporary: ACT and NT papers [skip ci]" && git push
