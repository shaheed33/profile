name: tmp-fetch-budget-papers
on: push
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download 2026-27 budget papers
        run: |
          mkdir papers && cd papers
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          get() { curl -sSL -A "$UA" --retry 3 -m 180 -o "$1" "$2" && echo "$1 $(stat -c%s "$1") $(sha256sum "$1"|cut -c1-64) $2" >> manifest.txt || echo "FAIL $1 $2" >> manifest.txt; }
          get nsw_bp1.pdf "https://www.nsw.gov.au/sites/default/files/noindex/2026-06/bp1-budget-statement-nsw-budget-2026-27.pdf"
          get nsw_bp1.docx "https://www.nsw.gov.au/sites/default/files/noindex/2026-07/2026-27-budget-paper-no.01-budget-statement.docx"
          get vic_bp5.pdf "https://s3.ap-southeast-2.amazonaws.com/vicbudgetfiles2026.27vicbudget/2026-27+State+Budget+-+Statement+of+Finances.pdf"
          get vic_bp2.pdf "https://s3.ap-southeast-2.amazonaws.com/vicbudgetfiles2026.27vicbudget/2026-27+State+Budget+-+Strategy+and+Outlook.pdf"
          get qld_bp2.pdf "https://budget.qld.gov.au/files/2026-27-budget-bp2-budget-strategy-outlook.pdf"
          get wa_bp3.pdf "https://www.ourstatebudget.wa.gov.au/2026-27/budget-papers/bp3/2026-27-wa-state-budget-bp3.pdf"
          get sa_bs.pdf "https://www.treasury.sa.gov.au/__data/assets/pdf_file/0006/1419036/2026-27-Budget-Statement.pdf"
          get tas_bp1.pdf "https://www.treasury.tas.gov.au/Documents/2026-27%20Budget%20Paper%20No.%201,%20Budget%20Strategy%20and%20Estimates.PDF"
          get act_outlook.docx "https://www.treasury.act.gov.au/__data/assets/word_doc/0005/3080660/2026-27-Budget-Outlook.docx"
          get nt_bp2.pdf "https://budget.nt.gov.au/__data/assets/pdf_file/0004/1609744/2026-27-budget-bp2.pdf"
          get pbo_nfo.pdf "https://www.pbo.gov.au/sites/default/files/2026-08/PBO%202026-27%20National%20Fiscal%20Outlook.pdf"
          file * ; cat manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: papers
          path: papers
