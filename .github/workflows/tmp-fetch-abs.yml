name: tmp-fetch-abs
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ABS files
        run: |
          mkdir -p tmp_abs4 && cd tmp_abs4
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          g() { curl -sSL -A "$UA" --retry 3 -m 300 -o "$1" "$2"; echo "$1 $(stat -c%s "$1" 2>/dev/null) $2" >> manifest.txt; }
          g gfs1617_003.xls "https://www.abs.gov.au/AUSSTATS/SUBSCRIBER.NSF/log?openagent&55120do003_201617.xls&5512.0&Data%20Cubes&BA8579FE298F9418CA258279001348E2&0&2016-17&26.04.2018&Latest"
          g gfs1617_004.xls "https://www.abs.gov.au/AUSSTATS/SUBSCRIBER.NSF/log?openagent&55120do004_201617.xls&5512.0&Data%20Cubes&284171027A90FCBCCA25827900134908&0&2016-17&26.04.2018&Latest"
          g gfs1617_005.xls "https://www.abs.gov.au/AUSSTATS/SUBSCRIBER.NSF/log?openagent&55120do005_201617.xls&5512.0&Data%20Cubes&95B52104B4464218CA2582790013492C&0&2016-17&26.04.2018&Latest"
          g gfs1617_006.xls "https://www.abs.gov.au/AUSSTATS/SUBSCRIBER.NSF/log?openagent&55120do006_201617.xls&5512.0&Data%20Cubes&07E259DE5A296B13CA25827900134953&0&2016-17&26.04.2018&Latest"
          g gfs1617_007.xls "https://www.abs.gov.au/AUSSTATS/SUBSCRIBER.NSF/log?openagent&55120do007_201617.xls&5512.0&Data%20Cubes&C7D3266390D6F8EECA2582790013497A&0&2016-17&26.04.2018&Latest"
          g gfs1617_008.xls "https://www.abs.gov.au/AUSSTATS/SUBSCRIBER.NSF/log?openagent&55120do008_201617.xls&5512.0&Data%20Cubes&F794ED8F58E702B8CA2582790013499C&0&2016-17&26.04.2018&Latest"
          g gfs1617_009.xls "https://www.abs.gov.au/AUSSTATS/SUBSCRIBER.NSF/log?openagent&55120do009_201617.xls&5512.0&Data%20Cubes&331743A606D3204FCA258279001349C3&0&2016-17&26.04.2018&Latest"
          g gfs1617_010.xls "https://www.abs.gov.au/AUSSTATS/SUBSCRIBER.NSF/log?openagent&55120do010_201617.xls&5512.0&Data%20Cubes&5AF07499F7042ED4CA258279001349E9&0&2016-17&26.04.2018&Latest"
          file * | head -40
          cat manifest.txt
      - name: Commit
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A tmp_abs4 && git commit -m "Temporary: ABS files [skip ci]" && git push
