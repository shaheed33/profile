name: tmp-fetch-abs
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ABS files
        run: |
          mkdir -p tmp_abs2 && cd tmp_abs2
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          g() { curl -sSL -A "$UA" --retry 3 -m 300 -o "$1" "$2"; echo "$1 $(stat -c%s "$1" 2>/dev/null) $2" >> manifest.txt; }
          B=https://www.abs.gov.au/statistics/economy/government
          for n in 003 004 005 006 007 008 009 010; do g gfs_$n.xlsx "$B/government-finance-statistics-annual/2024-25/55120DO${n}_202425.xlsx"; done
          for y in 2015-16:201516 2016-17:201617 2017-18:201718 2018-19:201819; do p=${y%%:*}; c=${y##*:}; g tax_$c.xlsx "$B/taxation-revenue-australia/$p/55060DO001_$c.xlsx"; done
          file * | head -40
          cat manifest.txt
      - name: Commit
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A tmp_abs2 && git commit -m "Temporary: ABS files [skip ci]" && git push
