name: tmp-fetch-abs
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ABS files
        run: |
          mkdir -p tmp_abs5 && cd tmp_abs5
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          g() { curl -sSL -A "$UA" --retry 3 -m 300 -o "$1" "$2"; echo "$1 $(stat -c%s "$1" 2>/dev/null) $2" >> manifest.txt; }
          g wpi.csv "https://data.api.abs.gov.au/rest/data/ABS,WPI/all?format=csvfilewithlabels&startPeriod=2000"
          g rba_f2_1.csv "https://www.rba.gov.au/statistics/tables/csv/f2.1-data.csv"
          g rba_f2.csv "https://www.rba.gov.au/statistics/tables/csv/f2-data.csv"
          g rba_f2_hist.xls "https://www.rba.gov.au/statistics/tables/xls-hist/f02hist.xls"
          file * | head -40
          cat manifest.txt
      - name: Commit
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A tmp_abs5 && git commit -m "Temporary: ABS files [skip ci]" && git push
