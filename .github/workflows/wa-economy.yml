name: Update WA economy nowcast

on:
  schedule:
    - cron: "0 23 19 * *"   # 20th of each month, 7am Perth time, after the Labour Force release
    - cron: "0 23 28 2,5,8,11 *"   # 29th of Feb (1 Mar), May, Aug, Nov: after the construction and
                                   # business investment surveys, before State Final Demand
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/wa_*.py"
      - "scripts/build_wa_economy.py"
      - ".github/workflows/wa-economy.yml"

permissions:
  contents: write

concurrency:
  group: wa-economy
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn requests
      - name: Download data and rebuild the model
        id: build
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          mkdir -p raw/wa
          set -o pipefail
          python -u scripts/build_wa_economy.py 2>&1 | tee raw/wa/build.log
      - name: Save the changes
        if: always()
        run: |
          git config user.name "wa-economy-bot"
          git config user.email "actions@users.noreply.github.com"
          # keep the raw archive compressed, and never commit a file GitHub would refuse
          for f in raw/wa/*.csv; do [ -e "$f" ] && gzip -nkf "$f"; done
          find raw/wa -name "*.gz" -size +90M -print -delete
          ls -la raw/wa | tee -a raw/wa/build.log
          # add each path on its own, so a missing data/wa_economy.js (failed build) cannot stop the rest
          for p in raw/wa/build.log raw/wa/*.gz data/wa_economy.js; do [ -e "$p" ] && git add -- "$p"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "WA economy nowcast: refresh $(date -u +%Y-%m-%d)"
          # raw/wa/*.csv are gitignored, but stash anything else so the rebase can run
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Report a failed build
        if: steps.build.outcome == 'failure'
        run: |
          echo "The build failed. See raw/wa/build.log"
          exit 1
